# NeuroDecipher — full stack
# Services: postgres, redis, backend (Flask API / gunicorn), worker (Celery),
# frontend (nginx-served Vite build). Each is its own container/image so they
# can be scaled, redeployed, and monitored independently (e.g. as separate
# ECS services, or separate EC2 auto-scaling groups).
#
# Project/container naming: every container is grouped under the
# "neurodecipher" Compose project (see `name:` below) and prefixed
# neurodecipher-* (postgres, redis, backend, frontend) or
# neurodecipher-worker-N (worker is left unnamed so it can be scaled with
# `docker compose up -d --scale worker=3`).
#
# If you have older containers/images/volumes from a previous setup (e.g.
# from before this compose file existed, or from a different project name),
# remove them first so there's no name/port collision:
#   docker ps -a                                  # see what's running
#   docker rm -f $(docker ps -aq --filter "name=neurodecipher")
#   docker volume ls                               # check for stale volumes
#   docker network prune                           # clean up unused networks
#
# Usage:
#   cp .env.example .env      # fill in real secrets + model paths
#   docker compose up -d --build
#
# See DEPLOY.md for AWS-specific notes (RDS/ElastiCache instead of the
# postgres/redis containers, ECS task defs, ALB routing, etc).

name: neurodecipher

networks:
  neurodecipher_net:
    driver: bridge

volumes:
  neurodecipher_pgdata:
  neurodecipher_redisdata:
  neurodecipher_uploads:
  neurodecipher_reports:

services:
  postgres:
    image: postgres:16
    container_name: neurodecipher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neurodecipher}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - neurodecipher_pgdata:/var/lib/postgresql/data
    networks: [neurodecipher_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neurodecipher}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: neurodecipher-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - neurodecipher_redisdata:/data
    networks: [neurodecipher_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: neurodecipher-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neurodecipher}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    volumes:
      - neurodecipher_uploads:/app/neurodecipher_uploaded_files
      - neurodecipher_reports:/app/generated_reports
      - ./backend/models:/app/models:ro
    networks: [neurodecipher_net]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "celery_worker:celery_app", "worker", "--loglevel=INFO"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neurodecipher}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - neurodecipher_uploads:/app/neurodecipher_uploaded_files
      - neurodecipher_reports:/app/generated_reports
      - ./backend/models:/app/models:ro
    networks: [neurodecipher_net]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker:celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
        VITE_MAX_UPLOAD_MB: ${VITE_MAX_UPLOAD_MB:-4096}
    container_name: neurodecipher-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    networks: [neurodecipher_net]
    depends_on:
      - backend
